# Pile de production : application + MySQL.
#
#   cp .env.example .env   puis renseigner les secrets
#   docker compose up -d --build
#   docker compose exec app node dist/migrate.js
#
# Le fichier `.env` est passé tel quel au conteneur. Ce compose n'invente
# aucune valeur par défaut : elles vivent dans `api/lib/env.ts`, qui est aussi
# le seul à valider la configuration. Deux jeux de défauts — un ici, un dans le
# code — donneraient deux comportements selon la façon de démarrer.
#
# Le développement utilise `docker-compose.dev.yml`, qui ne fournit que MySQL.
services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?renseignez MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?renseignez MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?renseignez MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?renseignez MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Non publié sur l'hôte : seule l'application y accède, par le réseau interne.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # L'étage `production` : celui qui sait imprimer. Le compose construisait
    # l'image sans `auto-multiple-choice` — un `docker compose up -d` démarrait
    # donc une application incapable d'imprimer un sujet, alors que l'atelier
    # papier est la moitié du produit.
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Tout le contrat de configuration vient de `.env`, tel qu'il est décrit
    # dans `.env.example`. Ce qui suit ne le complète pas : ce sont les trois
    # valeurs que le conteneur impose, parce qu'elles décrivent sa propre
    # topologie et non un choix de l'exploitant.
    env_file: .env
    environment:
      NODE_ENV: production
      # La base écoute sur le réseau interne du compose, jamais sur l'hôte.
      DATABASE_URL: mysql://${MYSQL_USER:?}:${MYSQL_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:?}
      # Le volume monté ci-dessous, pas un chemin du dépôt.
      PAPER_OUTPUT_DIR: /data/paper-exams
    volumes:
      - paper_exams:/data/paper-exams
    ports:
      - "127.0.0.1:3000:3000"
    # ── Moindre privilège ────────────────────────────────────────────────
    #
    # L'application tourne sous `evalapp`, écoute sur 3000 — un port non
    # privilégié — et n'a besoin d'aucune capacité du noyau. La composition
    # AMC non plus : une génération complète a été éprouvée racine en lecture
    # seule, sans capacité, sans réseau, et elle produit ses trois documents.
    #
    # Ce qui reste inscriptible, et rien d'autre : le volume des tirages, et
    # `/tmp`, dont TeX se sert pour engendrer les polices manquantes.
    read_only: true
    # Les deux seuls répertoires que la composition doit pouvoir écrire, et
    # rien d'autre : `/tmp`, où TeX engendre les polices qui lui manquent
    # (`TEXMFVAR`), et le répertoire personnel d'`evalapp`, où AMC crée son
    # `.AMC.d` au premier lancement. Les deux sont en mémoire, remis à zéro à
    # chaque démarrage : rien de ce que le produit conserve n'y vit.
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /home/evalapp:rw,size=64m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Un enseignant authentifié fournit indirectement du LaTeX. Les bornes de
    # `api/paper/amc-template.ts` l'empêchent de demander l'impossible ; ces
    # trois-ci bornent ce que la machine y consacre s'il y parvient malgré
    # tout — mémoire, processeur, et le nombre de processus, qui ferme la
    # porte à une bombe de duplication.
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    # Le temps qu'une remise de copie en cours aille à son terme avant que
    # Docker ne tue le conteneur. La séquence d'arrêt s'en tient à vingt
    # secondes ; on lui laisse dix de marge.
    stop_grace_period: 30s

volumes:
  mysql_data:
  paper_exams:
