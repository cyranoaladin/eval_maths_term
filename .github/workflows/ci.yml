name: CI

#
# Toutes les actions sont épinglées par empreinte de commit complète, jamais par
# étiquette : `@v7` se déplace, une empreinte non. Le commentaire qui suit
# chaque empreinte donne la version lisible, et c'est lui qu'on relit lors d'une
# montée de version — voir `docs/DEPENDANCES.md` pour la procédure.
#

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  # Le protocole de release exige TROIS exécutions complètes et indépendantes
  # du même commit — pas des « rerun failed jobs ». `workflow_dispatch` permet
  # de les lancer une à une sur le SHA candidat.
  workflow_dispatch:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
# Les exécutions déclenchées à la main, elles, sont indépendantes par
# construction — chacune son groupe — sinon la deuxième annulerait la première
# et les « trois exécutions vertes consécutives » seraient inobtenables.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'branche' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

# Les actions sont épinglées par version majeure, et remontées volontairement :
# celles d'origine tournaient encore sur Node 20, que GitHub a déprécié.

# Aucun job ne tolère l'échec, et aucune étape ne porte `continue-on-error` :
# un contrôle qu'on peut ignorer n'est pas un contrôle.

jobs:
  # ── Types, style, tests, couverture, build ──────────────────────────────────
  qualite:
    name: Qualité
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        # Le journal est gardé : les dépréciations de dépendances n'apparaissent
        # qu'à l'installation, et le portail des avertissements les relit.
        run: npm ci --no-audit --no-fund 2>&1 | tee install.log

      # Les tests d'intégration parlent à une vraie base : la moitié de la
      # logique métier — propriété des données, transactions, invariants de
      # correction — ne s'éprouve pas autrement.
      #
      # La base est démarrée ici plutôt que par `services:` parce que ce bloc
      # exige des identifiants littéraux dans le fichier. Ceux-ci sont tirés au
      # hasard à chaque exécution, masqués dans le journal, et meurent avec le
      # runner : aucune valeur écrite dans ce dépôt n'ouvre quoi que ce soit.
      - name: Base de données éphémère
        run: bash .github/base-ephemere.sh eval_maths_test

      - name: Secrets éphémères
        run: bash .github/secrets-ephemeres.sh

      - name: Vérification des types
        run: npm run check

      - name: Style
        run: npm run lint

      - name: Tests et couverture
        run: npm run test:coverage

      - name: Build
        run: npm run build 2>&1 | tee build.log

      # Un journal de construction qui imprime six avertissements à chaque
      # exécution finit par en imprimer sept sans que personne ne le remarque.
      # Tout avertissement absent de security/avertissements-connus.json — qui
      # nomme l'origine, la chaîne et la raison de chacun — ferme la porte.
      - name: Avertissements
        run: node scripts/verifier-avertissements.mjs install.log build.log

      # Ce qu'un élève télécharge avant de voir sa première question. Le seuil
      # de Rollup ne distingue pas un fichier chargé à la demande d'un fichier
      # imposé à tous ; celui-ci mesure le premier chargement, et refuse qu'une
      # bibliothèque lourde s'y invite.
      - name: Budget du premier chargement
        run: node scripts/verifier-budget-chargement.mjs

  # ── Parcours navigateur, contre le build de production ──────────────────────
  e2e:
    name: Parcours navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Base de données éphémère
        run: bash .github/base-ephemere.sh eval_maths

      - name: Secrets éphémères
        run: bash .github/secrets-ephemeres.sh

      - name: Navigateurs
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Version attendue de l'artefact
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # La version du produit vient de `package.json`, pas du nom de la
      # référence git : une branche n'est pas une version, et le serveur doit
      # annoncer la même chose ici, dans l'image et sur la machine de recette.
      - name: Construire l'artefact de production
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: npm run build

      # Migrations, puis un jeu de données déterministe : sans lui, les écrans
      # enseignant s'appuyaient sur un tirage créé à la main un jour dans une
      # base de développement, et échouaient sur une base neuve.
      - name: Migrations et jeu de données
        run: |
          node dist/migrate.js
          node dist/seed.js
          npx tsx scripts/dev-session.ts
          npx tsx scripts/fixtures-e2e.ts

      # Le serveur de production, pas celui de développement : la politique de
      # contenu, le découpage du bundle et les consignes de cache n'y sont pas
      # les mêmes, et trois défauts s'y étaient déjà cachés.
      # Le serveur de production, pas celui de développement — et avec un cycle
      # de vie explicite : port vérifié libre, aucun résidu du projet, pid
      # capturé, disponibilité attendue, version et empreinte contrôlées.
      - name: Démarrer le serveur de production
        env:
          PORT_E2E: "3200"
          APP_VERSION_ATTENDUE: ${{ steps.version.outputs.version }}
          GIT_SHA_ATTENDU: ${{ github.sha }}
        run: bash scripts/serveur-e2e.sh demarrer

      # Régression visuelle, avant les parcours.
      #
      # L'ordre compte : les parcours ouvrent des copies, et le tableau de bord
      # de l'enseignant les compte. Passée après eux, la comparaison porterait
      # sur un jeu de données qui n'est plus celui des références.
      #
      # Les images sont produites dans l'image officielle de Playwright et
      # nulle part ailleurs : comparées depuis un poste ou un runner, elles
      # compareraient d'abord des polices. Aucune n'est mise à jour ici — une
      # différence doit être regardée par quelqu'un.
      - name: Régression visuelle
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
        run: |
          # Le cookie est fabriqué ici, où la configuration du serveur existe :
          # le conteneur de Playwright, lui, ne l'a pas.
          E2E_COOKIE_ENSEIGNANT="$(npx tsx scripts/dev-session.ts | sed -n 's/.*kimi_sid=\([^;]*\).*/\1/p' | head -1)"
          test -n "$E2E_COOKIE_ENSEIGNANT" || { echo "session enseignant introuvable"; exit 1; }
          export E2E_COOKIE_ENSEIGNANT
          npm run e2e:visuel

      # Un moteur à la fois, chacun dans son étape.
      #
      # Enchaînés dans une seule exécution, les trois navigateurs finissaient par
      # épuiser la mémoire du runner : Firefox s'est fermé au milieu de la
      # vingt-cinquième page, et les tests suivants ont échoué sur un navigateur
      # mort. Ce n'est pas une instabilité du produit, et la masquer par une
      # reprise l'aurait fait passer pour telle.
      #
      # `retries` reste à zéro : une instabilité masquée par une reprise est une
      # instabilité qu'on retrouvera un jour d'épreuve.
      # Un fichier à la fois, dans un navigateur neuf.
      #
      # Gecko se fermait vers la vingtième page — « Target page, context or
      # browser has been closed » — et les tests suivants échouaient sur un
      # navigateur mort. Les pages de cette application chargent KaTeX et
      # MathLive ; enchaînées dans un seul navigateur, elles dépassent ce dont
      # dispose un runner. Une exécution par fichier borne la mémoire sans rien
      # retirer au gate.
      - name: Chromium
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
        run: |
          for fichier in e2e/*.spec.ts; do
            # La régression visuelle a son propre projet, exécuté plus haut.
            case "$fichier" in *regression-visuelle*) continue ;; esac
            echo "── $fichier"
            npx playwright test --project=chromium --retries=0 "$fichier"
          done

      - name: Firefox
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
        run: |
          for fichier in e2e/*.spec.ts; do
            # La régression visuelle a son propre projet, exécuté plus haut.
            case "$fichier" in *regression-visuelle*) continue ;; esac
            echo "── $fichier"
            npx playwright test --project=firefox --retries=0 "$fichier"
          done

      - name: WebKit
        env:
          E2E_BASE_URL: http://127.0.0.1:3200
        run: |
          for fichier in e2e/*.spec.ts; do
            # La régression visuelle a son propre projet, exécuté plus haut.
            case "$fichier" in *regression-visuelle*) continue ;; esac
            echo "── $fichier"
            npx playwright test --project=webkit --retries=0 "$fichier"
          done

      # Le Firefox de Playwright n'applique pas COOP : son pilote s'y perd, et
      # la dérogation est documentée dans `e2e/fixtures.ts`. Elle ne vaut que
      # si quelqu'un vérifie ailleurs que Gecko, lui, se comporte normalement
      # quand l'en-tête est bien appliqué. Firefox ESR de série, piloté par
      # Marionette, sans Playwright, contre le même artefact de production.
      - name: Firefox de série, COOP appliquée
        run: |
          docker build -f docker/firefox-natif.Dockerfile -t firefox-natif .
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/scripts":/app/scripts:ro firefox-natif \
            node scripts/smoke-firefox-coop.mjs http://127.0.0.1:3200 100

      # Toujours, succès ou échec : le runner n'a pas à ramasser derrière nous.
      - name: Arrêter le serveur et vérifier qu'il ne reste rien
        if: always()
        env:
          PORT_E2E: "3200"
        run: bash scripts/serveur-e2e.sh arreter

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Une base vierge se monte depuis le dépôt ────────────────────────────────
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Base de données éphémère
        run: bash .github/base-ephemere.sh eval_maths

      - name: Secrets éphémères
        run: bash .github/secrets-ephemeres.sh

      # Garde-fou : les migrations ne contenaient que des ALTER sans journal, et
      # aucune base ne pouvait être construite depuis le dépôt.
      #
      # Le migrateur éprouvé est celui de production — `node dist/migrate.js`,
      # le binaire livré dans l'image — et non la CLI drizzle-kit, qui ne sert
      # qu'à l'AUTHORING des migrations et vit dans son environnement séparé
      # (`tools/migrations/`). Le gate teste le chemin réellement déployé.
      - name: Construire le migrateur de production
        run: node scripts/build.mjs --sans-navigateur

      - name: Monter une base vierge et la peupler
        run: |
          node dist/migrate.js
          npx tsx db/seed.ts

      # Rejouer sur une base déjà migrée ne doit rien changer : c'est ce qui
      # rend une mise à jour de production reproductible.
      - name: Rejouer les migrations est sans effet
        run: node dist/migrate.js

      # Les réponses annoncées par les questions et les barèmes qui les notent
      # doivent s'accorder — sinon toute une classe a faux sans qu'on le sache.
      - name: Cohérence des barèmes
        run: npx tsx scripts/audit-coherence-questions.ts

  # ── L'image qui sera déployée, éprouvée telle quelle ────────────────────────
  image:
    name: Image de production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # La recette pilote l'application par ses propres routes : elle a besoin
      # du client tRPC du dépôt, pas seulement de l'image.
      - run: npm ci --no-audit --no-fund

      - name: Version attendue de l'artefact
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # L'image de production embarque `auto-multiple-choice` : c'est le même
      # artefact qui est construit ici, éprouvé par la recette et démarré par le
      # compose. Il y en avait deux, et ce qui était vérifié n'était pas ce qui
      # était déployé.
      - name: Construire l'image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: atelier-qcm:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vingt-huit vérifications sur le runtime réel : base vierge, migrations
      # depuis l'image, garde-fous de production, démarrage, chaîne papier
      # complète avec une génération AMC réelle.
      - name: Recette de mise en service
        run: RECETTE_IMAGE=atelier-qcm:ci bash scripts/recette-docker.sh

      # La matrice de preuve papier : dix tirages — un élève, trente élèves,
      # formules, accents, énoncé long multi-pages, vrai/faux, écriture arabe,
      # nom mixte, corpus Unicode, classe mixte — vérifiés sur leurs
      # invariants fonctionnels, jamais sur l'empreinte des PDF, que le moteur
      # horodate. Les cas arabes portent en plus une preuve visuelle : rendu
      # raster déterministe comparé aux références de scripts/refs-papier/,
      # et deux générations concurrentes identiques à la référence.
      - name: Matrice de preuve papier
        run: |
          npx tsx scripts/matrice-preuve-papier.ts /tmp/matrice
          bash scripts/verifier-matrice-papier.sh atelier-qcm:ci /tmp/matrice

      # Les entrées difficiles, en deux couches : ce que les bornes refusent en
      # nommant la cause, et ce qu'AMC doit encaisser sans planter, sans se
      # bloquer, sans rien exécuter et sans écrire hors de son dossier.
      - name: Corpus des entrées limites
        run: |
          npx tsx scripts/corpus-limites.ts /tmp/limites
          bash scripts/verifier-corpus-limites.sh atelier-qcm:ci /tmp/limites

  # ── Chaîne d'approvisionnement ──────────────────────────────────────────────
  securite:
    name: Sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # L'analyse de secrets lit l'historique, pas seulement la pointe.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Chaque signalement écarté l'est nominativement, dans `.gitleaksignore`,
      # avec sa raison : ni règle désactivée, ni chemin exclu, ni motif ignoré.
      # Rien de ce qui entre dans un artefact ou dans un gate ne doit être
      # désigné par une étiquette : `@v7` se déplace, une empreinte non.
      - name: Épinglage des dépendances
        run: bash scripts/verifier-epinglage.sh

      - name: Analyse de secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b \
            detect --source=/repo --redact --exit-code 1

      - name: Vulnérabilités des dépendances de production
        run: npm run audit:prod

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Construire l'image à analyser
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: atelier-qcm:securite
          cache-from: type=gha

      # ── Deux vues, et une seule qui décide ───────────────────────────────
      #
      # La première est brute : Trivy rapporte toutes les vulnérabilités
      # élevées et critiques, sans filtre, sans exclusion, sans liste
      # d'exceptions. Elle ne ferme aucune porte — elle donne à voir.
      - name: Analyse de l'image, brute
        run: bash scripts/scan-image.sh atelier-qcm:securite rapport-trivy.json

      # La même image, jamais reconstruite entre les étapes : la nomenclature
      # et le verdict portent sur l'artefact qui vient d'être analysé.
      - name: Nomenclature de l'image
        run: bash scripts/sbom-image.sh atelier-qcm:securite sbom-image.json

      # La seconde décide. Elle croise le rapport brut, la nomenclature et
      # l'attestation VEX, et échoue sur toute vulnérabilité applicable — ou
      # seulement indéterminée. Une CVE publiée demain, que personne n'a
      # examinée, ferme la porte : le portail est fermé par défaut.
      - name: Applicabilité des vulnérabilités
        run: node scripts/gate-applicabilite.mjs rapport-trivy.json sbom-image.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: securite
          path: |
            sbom-image.json
            rapport-trivy.json
            security/vex.openvex.json
          retention-days: 90
